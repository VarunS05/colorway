name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Deploys the serverless stack + gallery on every push to main. Requires
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets configured on the repo
  # (Settings -> Secrets and variables -> Actions) for an IAM user scoped to
  # this stack's deploy permissions.
  deploy:
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: npm install -g serverless@3
      - run: npm ci
      - run: pip install -r requirements.txt -t .
      - name: Deploy backend (Lambda, Step Functions, API Gateway)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: serverless deploy --stage prod
      - name: Build and deploy frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        # Deploy dist/ to your static host of choice (S3+CloudFront, Vercel,
        # Netlify, etc.) here -- omitted since it depends on which host you pick.
